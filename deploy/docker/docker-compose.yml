# Local development stack.
#
# Network posture: every published port binds to BIND_ADDR, loopback by
# default, so Postgres, Redis, Kafka and the API are reachable from this
# machine only (the API and scheduler, run on the host with `make run`, use
# these ports). Containers reach each other on the internal `apm` network.
# Never set BIND_ADDR=0.0.0.0 on a shared or public network: Redis and Kafka
# here are for development and Kafka has no authentication.
#
# Redis requires a password when REDIS_PASSWORD is set (then use
# REDIS_URL=redis://:<password>@localhost:6379/0). Production must always set
# one; the API refuses to start outside APP_ENV=development without it.
#
# Two ways to reach each dependency:
#   from the host (make run)    localhost:5433 / localhost:6379 / localhost:9092 / localhost:1025 (mail)
#   from a container on apm-net postgres:5432 / redis:6379 / apm-kafka:29092 / mailpit:1025
# The network has a fixed name, apm-net, so other Compose projects (the AI
# service) can join it; they reach this stack as apm-kafka and apm-api.
networks:
  apm:
    name: ${APM_NETWORK_NAME:-apm-net}
    driver: bridge

volumes:
  pg-data:
  kafka-data:

services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: ${KAFKA_CONTAINER_NAME:-apm-kafka}
    networks:
      apm:
        aliases: [apm-kafka]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    env_file:
      - .env.docker
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "${KAFKA_NODE_ID:-1}"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # A client is told to reconnect to the advertised address of the listener
      # it reached, so each audience gets an address it can resolve:
      #   INTERNAL apm-kafka:29092 for containers on apm-net,
      #   EXTERNAL localhost:<host port> for processes on the host.
      KAFKA_CFG_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://apm-kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_HOST_PORT:-9092}"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_NUM_PARTITIONS: "${KAFKA_PARTITIONS:-12}"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ${POSTGRES_CONTAINER_NAME:-apm-postgres}
    networks:
      - apm
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apm_password}
      POSTGRES_DB: ${POSTGRES_DB:-apm_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apm_user} -d ${POSTGRES_DB:-apm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-apm-redis}
    networks:
      - apm
    # An empty REDIS_PASSWORD leaves authentication off (development only).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    env_file:
      - .env.docker
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then export REDISCLI_AUTH=\"$$REDIS_PASSWORD\"; fi; redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local mail catcher (no TLS: requires SMTP_ALLOW_INSECURE=true, which only
  # APP_ENV=development accepts). Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: ${MAILPIT_CONTAINER_NAME:-apm-mailpit}
    networks:
      - apm
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MAIL_SMTP_HOST_PORT:-1025}:1025"
      - "${BIND_ADDR:-127.0.0.1}:${MAIL_UI_HOST_PORT:-8025}:8025"

  # Applies migrations once before the API and scheduler start. The services
  # themselves only auto-migrate when APP_ENV=development.
  apm-migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: apm-migrate
    command: ["./migrate", "-action", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ../../.env
        required: false
      - .env.docker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    networks:
      - apm

  apm-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: apm-api
    command: ["./apm"]
    depends_on:
      apm-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      # Application settings and secrets (JWT, encryption keys, ...) shared
      # with the host-run workflow, then Docker overrides.
      - path: ../../.env
        required: false
      - .env.docker
    environment:
      APP_MODE: "api"
      # Fixed container port: the port mapping below and apm-api:8080 (used by
      # the AI service) depend on it, whatever HTTP_PORT the host .env sets.
      HTTP_PORT: "8080"
      # Container addresses on apm-net, overriding the host-run localhost values.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      KAFKA_BROKERS: apm-kafka:29092
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DOCKER_SMTP_PORT:-1025}
    networks:
      apm:
        aliases: [apm-api]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:8080"

  apm-scheduler:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: apm-scheduler
    command: ["./scheduler"]
    depends_on:
      apm-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      # Application settings and secrets (JWT, encryption keys, ...) shared
      # with the host-run workflow, then Docker overrides.
      - path: ../../.env
        required: false
      - .env.docker
    environment:
      APP_MODE: "scheduler"
      # Container addresses on apm-net, overriding the host-run localhost values.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      KAFKA_BROKERS: apm-kafka:29092
      SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
      SMTP_PORT: ${DOCKER_SMTP_PORT:-1025}
    networks:
      - apm

  test:
    profiles: ["test"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: test
    networks:
      - apm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      APP_ENV: test
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: apm-kafka:29092
    command: ["go", "test", "-v", "./..."]
