networks:
  apm:
    driver: bridge

volumes:
  pg-data:
  kafka-data:

services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: ${KAFKA_CONTAINER_NAME:-apm-kafka}
    networks:
      - apm
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    env_file:
      - .env.docker
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "${KAFKA_NODE_ID:-1}"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_HOST_PORT:-9092}"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_NUM_PARTITIONS: "${KAFKA_PARTITIONS:-12}"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "${KAFKA_REPLICATION_FACTOR:-1}"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ${POSTGRES_CONTAINER_NAME:-apm-postgres}
    networks:
      - apm
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apm_password}
      POSTGRES_DB: ${POSTGRES_DB:-apm_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apm_user} -d ${POSTGRES_DB:-apm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-apm-redis}
    networks:
      - apm
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  apm-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: apm-api
    command: ["./apm"]
    environment:
      APP_MODE: "api"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env.docker
    networks:
      - apm
    ports:
      - "${HTTP_PORT:-8080}:8080"

  apm-scheduler:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: apm-scheduler
    command: ["./scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.docker
    networks:
      - apm

  test:
    profiles: ["test"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: test
    networks:
      - apm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      APP_ENV: test
      POSTGRES_HOST: postgres
      REDIS_HOST: redis:6379
      KAFKA_BROKERS: kafka:9092
    command: ["go", "test", "-v", "./..."]
