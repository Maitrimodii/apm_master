networks:
  apm:
    driver: bridge

volumes:
  pg-test-data:
  kafka-test-data:

services:
  kafka:
    image: bitnamilegacy/kafka:3.7
    container_name: apm-test-kafka
    networks:
      - apm
    ports:
      - "9092:9092"
    volumes:
      - kafka-test-data:/bitnami/kafka
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: apm-test-postgres
    networks:
      - apm
    ports:
      - "5433:5432"
    volumes:
      - pg-test-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: apm_user
      POSTGRES_PASSWORD: apm_password
      POSTGRES_DB: apm_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apm_user -d apm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apm-test-redis
    networks:
      - apm
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  apm_master:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
    container_name: apm-test-master
    networks:
      - apm
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: test
      HTTP_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: apm_user
      POSTGRES_PASSWORD: apm_password
      POSTGRES_DB: apm_db
      REDIS_HOST: redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: "test-secret-123456789012345678901234567890"
      LOG_LEVEL: debug
